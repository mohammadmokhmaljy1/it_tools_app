name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.1
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 https://github.com/flutter/flutter.git refs/tags/3.50.1
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
