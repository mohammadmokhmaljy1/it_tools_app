name: it_tools_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  cupertino_icons: ^1.0.8
  flutter_bloc: 9.1.1
  go_router: 18.1.1
  dio: 5.11.1
  get_it: 9.3.0
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.5
  riverpod_generator: 3.0.3
  build_runner: 2.10.4

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
