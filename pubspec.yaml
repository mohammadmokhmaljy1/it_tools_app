
name: it_tools_app
description: "IT Tools E-Commerce Customer Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Responsive Design
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.4.0

  # State Management
  flutter_bloc: 9.1.1
  equatable: ^3.0.0

  # Navigation
  go_router: 18.1.1

  # Dependency Injection
  get_it: 9.3.0

  # Networking
  dio: 5.11.1

  # Local Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Images
  cached_network_image: ^4.0.7

  # Date & Currency Formatting
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/banners/
    - assets/images/placeholders/
    - assets/images/products/
    - assets/icons/
    - assets/animations/
    - assets/images/empty_states/
  
  
  # تعريف الخطوط (Fonts)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700